spring.application.name=fx-ledger

# Every connection caps how long a statement waits for another transaction's
# lock. Set per connection rather than per method, because locks are taken in
# places that are easy to overlook: inserting a row whose foreign key points
# at a locked account waits for that lock too. A statement that times out
# fails with LOCK_TIMEOUT (503), and the request can be retried.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# ./gradlew bootRun starts this file's database (the Docker Compose support is
# a development-only dependency, absent from the packaged jar). compose.yaml
# is the full service, application included.
spring.docker.compose.file=compose.dev.yaml

# Swagger UI lists the tags in their numbered order, which is the order to
# try the API in.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
