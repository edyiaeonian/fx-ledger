name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle's downloads between runs and checks that the committed
      # gradle-wrapper.jar is an official one.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles, then runs every test. Tests that need PostgreSQL start a
      # real one through Testcontainers; the runner has Docker built in.
      - name: Build and test
        run: ./gradlew build --console=plain
